name: DensePose CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch CPU
        run: |
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Clone Detectron2
        run: |
          git clone --depth 1 \
            https://github.com/facebookresearch/detectron2.git \
            /tmp/detectron2

      - name: Install Detectron2
        run: |
          pip install --no-build-isolation -e /tmp/detectron2

      - name: Install DensePose
        run: |
          pip install --no-build-isolation \
            -e /tmp/detectron2/projects/DensePose

      - name: Verify imports
        run: |
          python -c "import torch; print('Torch:', torch.__version__)"
          python -c "import detectron2; print('Detectron2: OK')"
          python -c "import densepose; print('DensePose: OK')"
          python -c "import fastapi; print('FastAPI: OK')"

      - name: Compile Python files
        run: |
          python -m compileall app

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -f Dockerfile.cpu \
            -t densepose-backend:ci \
            .

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t densepose-frontend:ci \
            ./frontend

      - name: Verify Docker images
        run: |
          docker images densepose-backend:ci
          docker images densepose-frontend:ci