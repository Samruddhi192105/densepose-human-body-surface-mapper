services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu

    env_file:
      - .env.local

    environment:
      DENSEPOSE_TEST_SIZE: "480"

    ports:
      - "8000:8000"

    volumes:
      - ./input:/workspace/input
      - ./output:/workspace/output

    working_dir: /workspace

    command:
      [
        "uvicorn",
        "app.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    depends_on:
      - backend